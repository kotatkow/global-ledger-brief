name: October 10 read-only transport diagnostic

on:
  push:
    branches: [main]
    paths: [.github/workflows/ledger-read-diagnostic-2026-10-10.yml]

permissions:
  contents: read

jobs:
  inspect-public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read the established Sites API using the existing curl transport
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 --dump-header "$headers" --output "$body" --write-out '%{http_code}' 'https://global-ledger-brief.kotatko.chatgpt.site/api/editions')"
          printf 'Public GET /api/editions returned HTTP %s\n' "$status"
          grep -iE '^(content-type|server|cf-ray):' "$headers" || true
          python3 - "$body" "$status" <<'PY'
          import hashlib,json,re,sys
          raw=open(sys.argv[1],encoding='utf-8').read()
          try:
              value=json.loads(raw)
          except Exception:
              title=re.search(r'<title>(.*?)</title>',raw,re.I|re.S)
              print('Non-JSON response title:',title.group(1).strip()[:200] if title else '(none)')
              raise SystemExit(1)
          if sys.argv[2] != '200':
              print('JSON error:',str(value.get('error','(none)'))[:200])
              raise SystemExit(1)
          for desk in ('global','korea'):
              edition=value['latest'][desk]
              digest=hashlib.sha256(json.dumps(edition,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
              print(desk,edition['publicationDate'],edition['publishedAt'],len(edition['stories']),digest)
          print('Read-only diagnostic finished; no credentials used, no POSTs, no writes')
          PY
